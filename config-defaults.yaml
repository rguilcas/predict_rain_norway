### Basic hyperparameters
batch_size:
  desc: Size of each mini-batch
  value: 512
learning_rate:
  desc: Learning rate
  value: 0.0001
lr_scheduler:
  desc: Scheduler use for learning rate decay
  value: 'step'
num_epochs: 
  desc: Number of training epochs
  value: 50


### In/Out params
file_name_data_out:
  desc: Path to output data (daily rain data)
  value: '/Data/gfi/users/rogui7909/data/ERA5/era5_pr_6H_WNorway.nc'
quantile_thresh:
  desc: Quantile predicted
  value: .9
num_timesteps_predicted:
  desc: Timesteps predicted for future rain
  value: 12
season:
  desc: Season chosen for the prediction. Can be 'all' or 'DJF' 'MAM' 'JJA' or 'SON'
  value: 'DJF'

file_name_data_in:
  desc: Path to input data (atmos variables)
  value: "/Data/gfi/users/rogui7909/data/ERA5/dl_inputs_6H_32x128.zarr"
inputs: 
  desc: Input variables chosen 
  value: "u850 v850"
  

### Network params ViT
patch_size:
  desc: Size of patches for embeddings
  value: 8
embedding_dimension:
  desc: Size of embeddig vector
  value: 512
depth_transformer:
  desc: Number of transformer blocks
  value: 6
attention_heads:
  desc: Number of attention heads
  value: 8
mlp_dim:
  desc: feedforward layer size
  value: 512
dropout:
  desc: dropout probability
  value: 0.1
emb_dropout:
  desc: embedding dropout probability
  value: 0.1

## Network params CNM
num_conv_layer:
  desc: Number of convolution layers in the CNN
  value: 1
size_conv_kernel:
  desc: Size of the conv layer kernels
  value: 15
conv1_kernel_number:
  desc: Size of the first conv layer kernels
  value: 24
factor_increase_kernels_per_conv_layer:
  desc: How much to multiply the number of kernel in layer N to get layer N+1
  value: 2
attention:
  desc: adds spatial attention at the end of the cnn
  value: 'CBAM'
